# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
# SERVER_HOST           — Hetzner server public IP address (e.g., 5.161.x.x)
# SERVER_USER           — SSH login username (typically 'root')
# SERVER_SSH_KEY        — Full content of the SSH private key (including -----BEGIN/END lines)
# GHCR_TOKEN            — GitHub PAT with read:packages scope (classic PAT, not fine-grained)
# CLOUDFLARE_API_TOKEN  — Cloudflare dashboard -> My Profile -> API Tokens -> Create Token,
#                         "Edit Cloudflare Workers" template
# CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard -> Workers & Pages -> Account ID (right sidebar)
#
# All three jobs (build-and-push, deploy, deploy-frontend) verified green end-to-end 2026-11-08.

name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: nba-lines-tracker
          file: nba-lines-tracker/src/NbaTracker.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/sebodroid/nba-lock-loaded/api:latest
            ghcr.io/sebodroid/nba-lock-loaded/api:sha-${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: nba-lines-tracker
          file: nba-lines-tracker/src/NbaTracker.Worker/Dockerfile
          push: true
          tags: |
            ghcr.io/sebodroid/nba-lock-loaded/worker:latest
            ghcr.io/sebodroid/nba-lock-loaded/worker:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /root/app
            git pull origin master
            cd nba-lines-tracker
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # nginx's proxy_pass resolves the "api" hostname once at startup and
            # caches it — recreating just the api container above gives it a new
            # internal Docker IP that nginx won't notice on its own, so force a
            # restart every deploy rather than relying on compose to decide nginx
            # needs one (its image/config didn't change, so compose wouldn't).
            docker compose -f docker-compose.prod.yml restart nginx
            docker image prune -f

  # Independent of the backend jobs above — a frontend-only change (or a backend-only
  # change) should deploy without waiting on or being blocked by the other side. Before
  # this job existed, frontend changes only ever reached Cloudflare via someone manually
  # running `wrangler deploy` from a laptop, so a push to master could sit live in git for
  # days without ever actually being visible in the app.
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: nba-lines-tracker/frontend
        run: npm ci

      - name: Build
        working-directory: nba-lines-tracker/frontend
        run: npm run build

      # cloudflare/wrangler-action's own workingDirectory handling didn't reliably find
      # wrangler.jsonc in this subdirectory layout (errored "Missing entry-point" even
      # though wrangler.jsonc sets `main` correctly, and the same config deploys fine via
      # a plain local `npx wrangler deploy`) — calling wrangler directly under GitHub
      # Actions' own native working-directory, the same way it was run manually, sidesteps
      # whatever that action's own directory resolution was getting wrong.
      - name: Deploy to Cloudflare Workers
        working-directory: nba-lines-tracker/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
