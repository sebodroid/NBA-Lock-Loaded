# Mounted at /etc/nginx/conf.d/default.conf — the nginx:alpine base image's own
# nginx.conf already wraps everything under conf.d/ inside its own http{} block
# (and sets worker_processes/events itself), so this file must contain ONLY the
# server{} block, not a full standalone config.
server {
    listen 80;
    server_name _;

    # 127.0.0.11 is Docker Compose's embedded DNS server. A plain, non-variable
    # proxy_pass target resolves ONCE at nginx startup and is cached for the
    # worker process's lifetime — when CI redeploys and recreates the api
    # container (new internal IP), nginx keeps proxying to the dead old IP
    # until nginx itself is also restarted (502s until then). Routing proxy_pass
    # through a variable forces nginx to re-resolve via this resolver on each
    # request (respecting the TTL below), so a bare api-container redeploy can
    # never go stale here again.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass         $upstream_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # CORS: allow all origins — small friend-group app, frontend lives on a
        # different origin (Cloudflare Pages) than this API
        add_header         Access-Control-Allow-Origin  *;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type";

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check for monitoring / deploy verification
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # All other routes: 404 — the SPA is on Cloudflare Pages, not here
    location / {
        return 404;
    }
}
