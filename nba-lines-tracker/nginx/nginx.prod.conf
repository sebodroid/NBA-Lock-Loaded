worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass         http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

            # CORS: allow all origins — small friend-group app, frontend lives on a
            # different origin (Cloudflare Pages) than this API
            add_header         Access-Control-Allow-Origin  *;
            add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header         Access-Control-Allow-Headers "Authorization, Content-Type";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Health check for monitoring / deploy verification
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # All other routes: 404 — the SPA is on Cloudflare Pages, not here
        location / {
            return 404;
        }
    }
}
